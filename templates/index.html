{% extends 'base.html' %}
{% block content %}
<h1 class="mb-4">Upcoming Events</h1>
<div class="row">
    {% for event in events %}
    <div class="col-md-4 mb-4">
        <div class="card h-100">
            <img src="{{ event.image }}" class="card-img-top" alt="{{ event.title }}">
            <div class="card-body">
                <h5 class="card-title">{{ event.title }}</h5>
                <p class="card-text">{{ event.description[:80] }}...</p>
                <p class="card-text"><small class="text-muted">Available: {{ event.available_tickets }}</small></p>
                <a href="{{ url_for('event_detail', event_id=event.id) }}" class="btn btn-primary">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
